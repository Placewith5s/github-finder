<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Primary Meta Tags -->
    <title>GitHub Profile Finder</title>

    <!-- Open Graph / Facebook -->

    <link rel="stylesheet" href="style.css">

<body>
    <header>
        <h1>GitHub Profile Finder</h1>
    </header>

    <main>
        <label for="finder">
            Username:
        </label>
        <input
            type="search"
            autocomplete="name"
            placeholder="John Doe"
            required
            id="finder">

        <button
            type="submit"
            id="search-btn">
            Search Profile
        </button>

        <ul
            class="spaced-top"
            id="repo-info">
        </ul>
        <p
            class="spaced-bottom"
            id="repo-count">
            Total repositories: 0
        </p>

        <label for="show-forked">
            Show Forked?
        </label>
        <input
            type="checkbox"
            id="show-forked">

        <label for="show-archived">
            Show Archived?
        </label>
        <input
            type="checkbox"
            id="show-archived">
    </main>

    <script
        type="module"
        src="script.js">
    </script>
</body>
</html>
